plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.0-alpha.7'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Fabric API - use full bundle
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "maven.modrinth:sodium:mc26.2-0.9.1-fabric"
    implementation "maven.modrinth:iris:1.11.2+26.2-fabric"

    runtimeOnly 'org.anarres:jcpp:1.4.14'
    runtimeOnly 'io.github.douira:glsl-transformer:2.0.0-pre13'
    runtimeOnly 'net.java.dev.jna:jna:5.9.0'
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    base.archivesName = project.archives_base_name
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}

// LWJGL dependencies
project.ext.lwjglVersion = "3.4.1"
project.ext.jomlVersion = "1.10.4"

// Detect OS for native library selection
def osName = System.getProperty("os.name").toLowerCase()
project.ext.lwjglNatives = osName.contains("windows") ? "natives-windows" : "natives-linux"

dependencies {
    // LWJGL BOM for version management
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    // Core Vulkan dependencies - bundled with mod
    // All LWJGL provided by Minecraft 26.2 runtime (3.4.1-snapshot).
    // Bundling ANY lwjgl native causes ABI conflict → VK_ERROR_DEVICE_LOST.
    // Shaderc/spvc/meshoptimizer excluded — shader compilation deferred to build time.
    implementation("org.lwjgl:lwjgl:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-glfw:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-opengl:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-vulkan:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-vma:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-shaderc:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-spvc:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-meshoptimizer:$lwjglVersion")
    implementation("org.joml:joml:${jomlVersion}")
}

// ===== NVIDIA NGX (DLSS) natives: opt-in =====
// native/ngx_shim builds ngxshim.dll / libngxshim.so against the NVIDIA DLSS SDK, and the vendor
// nvngx_* feature libraries ship alongside it. Both are NVIDIA-licensed binaries and are NOT checked
// into this repository (see THIRD_PARTY_NOTICES.md) — they are produced by the `native-ngx` CI
// workflow and bundled here.
//
// Bundling is OPT-IN: a plain `./gradlew build` (what the existing Check Build workflow runs) is
// unaffected, and the mod builds without DLSS. Pass -PbundleNgxNatives=true to include them.
def bundleNgxNativesRequested = findProperty("bundleNgxNatives") != null
def ngxShimConfig = (findProperty("ngxShimConfig") ?: "release").toString().toLowerCase(Locale.ROOT)
def ngxVendorConfig = {
    def normalized = (findProperty("ngxVendorConfig") ?: "rel").toString().toLowerCase(Locale.ROOT)
    if (normalized == "release") {
        return "rel"
    }
    if (normalized == "debug") {
        return "dev"
    }
    if (normalized != "rel" && normalized != "dev") {
        throw new GradleException("Unknown ngxVendorConfig '${normalized}'. Expected 'rel' or 'dev'.")
    }
    return normalized
}()

def ngxNativeGenRoot = layout.buildDirectory.dir("generated/ngx-natives")
def ngxShimOutDir = new File(layout.buildDirectory.dir("native/ngx_shim").get().asFile, ngxShimConfig)
def ngxCurrentPlatform = {
    def os = org.gradle.internal.os.OperatingSystem.current()
    def arch = System.getProperty("os.arch", "").toLowerCase(Locale.ROOT)
    def x64 = arch == "x86_64" || arch == "amd64"
    if (os.windows && x64) {
        return "windows-x64"
    }
    if (os.linux && x64) {
        return "linux-x64"
    }
    return null
}()
def ngxNativePlatforms = [
    [
        name: "windows-x64",
        shimIncludes: ["ngxshim.dll"],
        vendorRoot: { dlssSdkRoot, vendorConfig -> new File(dlssSdkRoot, "lib/Windows_x86_64/${vendorConfig}") },
        vendorIncludes: ["nvngx_dlssd.dll", "nvngx_dlssg.dll"]
    ],
    [
        name: "linux-x64",
        shimIncludes: ["libngxshim.so"],
        vendorRoot: { dlssSdkRoot, vendorConfig -> new File(dlssSdkRoot, "lib/Linux_x86_64/${vendorConfig}") },
        vendorIncludes: ["libnvidia-ngx-dlssd.so*", "libnvidia-ngx-dlssg.so*"]
    ]
]
def ngxNativePlatformByName = ngxNativePlatforms.collectEntries { platform -> [(platform.name): platform] }
def requestedNgxPlatforms = (findProperty("ngxPlatforms") ?: "current").toString()
        .split(",")
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
def selectedNgxNativePlatforms
if (requestedNgxPlatforms.size() == 1 && requestedNgxPlatforms[0].equalsIgnoreCase("all")) {
    selectedNgxNativePlatforms = ngxNativePlatforms
} else if (requestedNgxPlatforms.size() == 1 && requestedNgxPlatforms[0].equalsIgnoreCase("current")) {
    if (ngxCurrentPlatform == null || !ngxNativePlatformByName.containsKey(ngxCurrentPlatform)) {
        throw new GradleException("No NGX native platform is configured for this host. " +
                "Pass -PngxPlatforms=windows-x64,linux-x64 explicitly.")
    }
    selectedNgxNativePlatforms = [ngxNativePlatformByName[ngxCurrentPlatform]]
} else {
    def unknownPlatforms = requestedNgxPlatforms.findAll { !ngxNativePlatformByName.containsKey(it) }
    if (!unknownPlatforms.empty) {
        throw new GradleException("Unknown NGX platform(s): ${unknownPlatforms.join(', ')}")
    }
    selectedNgxNativePlatforms = requestedNgxPlatforms.collect { ngxNativePlatformByName[it] }
}

def dlssSdkRootProvider = providers.environmentVariable("DLSS_SDK").map { file(it) }

def bundleNgxNatives = tasks.register("bundleNgxNatives") {
    group = "build"
    description = "Bundles the NGX shim and ${ngxVendorConfig} DLSS native libraries into the mod resources."

    inputs.property "ngxShimConfig", ngxShimConfig
    inputs.property "ngxVendorConfig", ngxVendorConfig
    selectedNgxNativePlatforms.each { platform ->
        inputs.files(fileTree(ngxShimOutDir) {
            include platform.shimIncludes
        }).withPropertyName("ngxNatives.${platform.name}.shim")
    }
    outputs.dir(ngxNativeGenRoot)
    outputs.upToDateWhen { false }

    doLast {
        delete(ngxNativeGenRoot)
        def dlssSdkRoot = dlssSdkRootProvider.orNull
        if (dlssSdkRoot == null) {
            throw new GradleException("DLSS_SDK environment variable is not set. " +
                    "Check out https://github.com/NVIDIA/DLSS and point DLSS_SDK at it.")
        }
        def missing = []
        selectedNgxNativePlatforms.each { platform ->
            if (fileTree(ngxShimOutDir) { include platform.shimIncludes }.files.empty) {
                missing += "${platform.name} shim library in ${ngxShimOutDir} " +
                        "(build it with: cmake -S native/ngx_shim -B build/cmake/ngx_shim " +
                        "&& cmake --build build/cmake/ngx_shim --config Release)"
            }
            def platformVendorRoot = platform.vendorRoot(dlssSdkRoot, ngxVendorConfig)
            def missingVendor = platform.vendorIncludes.findAll { vendorInclude ->
                fileTree(platformVendorRoot) { include vendorInclude }.files.empty
            }
            if (!missingVendor.empty) {
                missing += "${platform.name} vendor libraries ${missingVendor.join(', ')} in ${platformVendorRoot}"
            }
        }
        if (!missing.empty) {
            throw new GradleException("Missing NGX native inputs:\n - " + missing.join("\n - "))
        }

        copy {
            selectedNgxNativePlatforms.each { platform ->
                from(fileTree(ngxShimOutDir) { include platform.shimIncludes }) {
                    into "vulkanite/natives/${platform.name}"
                }
                from(fileTree(platform.vendorRoot(dlssSdkRoot, ngxVendorConfig))) {
                    include platform.vendorIncludes
                    into "vulkanite/natives/${platform.name}"
                }
            }
            into ngxNativeGenRoot
        }
    }
}

if (bundleNgxNativesRequested) {
    sourceSets.main.resources.srcDir(files(ngxNativeGenRoot).builtBy(bundleNgxNatives))
}
