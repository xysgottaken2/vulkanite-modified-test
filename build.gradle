plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.0-alpha.7'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Fabric API - use full bundle
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "maven.modrinth:sodium:mc26.2-0.9.1-fabric"
    implementation "maven.modrinth:iris:1.11.2+26.2-fabric"

    runtimeOnly 'org.anarres:jcpp:1.4.14'
    runtimeOnly 'io.github.douira:glsl-transformer:2.0.0-pre13'
    runtimeOnly 'net.java.dev.jna:jna:5.9.0'
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    base.archivesName = project.archives_base_name
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}

// LWJGL dependencies
project.ext.lwjglVersion = "3.4.1"
project.ext.jomlVersion = "1.10.4"

// Detect OS for native library selection
def osName = System.getProperty("os.name").toLowerCase()
project.ext.lwjglNatives = osName.contains("windows") ? "natives-windows" : "natives-linux"

dependencies {
    // LWJGL BOM for version management
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    // Core Vulkan dependencies - bundled with mod
    // All LWJGL provided by Minecraft 26.2 runtime (3.4.1-snapshot).
    // Bundling ANY lwjgl native causes ABI conflict → VK_ERROR_DEVICE_LOST.
    // Shaderc/spvc/meshoptimizer excluded — shader compilation deferred to build time.
    implementation("org.lwjgl:lwjgl:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-glfw:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-opengl:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-vulkan:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-vma:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-shaderc:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-spvc:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-meshoptimizer:$lwjglVersion")
    implementation("org.joml:joml:${jomlVersion}")
}
